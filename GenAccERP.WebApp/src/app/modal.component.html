<div class="app-modal-overlay" [class.active]="visible" (click)="onClose()">
  <div class="app-modal-dialog" role="dialog" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <div class="app-modal-header">
      <h5 class="app-modal-title">{{title}}</h5>
      <button type="button" class="app-modal-close" aria-label="Close" (click)="onClose()">&times;</button>
    </div>
    <div class="app-modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
