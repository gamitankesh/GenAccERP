<h2 class="content-title">User Management</h2>
<div class="toolbar">
  <button class="btn btn-primary" (click)="addUser()">&#43; Add New User</button>
</div>
<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Created Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>
        <td>{{ u.createdDate | date }}</td>
        <td>
          <button class="btn btn-action" (click)="">Edit</button>
          <button *ngIf="u.username!=='admin'" class="btn btn-danger" (click)="deleteUser(u.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
