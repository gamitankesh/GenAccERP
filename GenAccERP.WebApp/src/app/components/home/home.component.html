<h2 class="content-title">Dashboard Overview</h2>
<div class="dashboard-grid">
  <div class="summary-card users-card">
    <div class="card-title">Active Users</div>
    <div class="card-value">{{ totalUsers }}</div>
  </div>
  <div class="summary-card">
    <div class="card-title">Registered Items</div>
    <div class="card-value">{{ totalItems }}</div>
  </div>
  <div class="summary-card purchases-card">
    <div class="card-title">Total Purchases (Qty)</div>
    <div class="card-value">{{ totalPurchases }}</div>
  </div>
  <div class="summary-card sales-card">
    <div class="card-title">Total Sales (Qty)</div>
    <div class="card-value">{{ totalSales }}</div>
  </div>
</div>
