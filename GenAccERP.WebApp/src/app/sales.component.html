<div class="page-header">
  <h1 class="content-title">Sales</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">New Sale</button>
</div>

<div class="table-container">
  <table>
    <thead><tr><th>Date</th><th>Item</th><th>Quantity</th><th class="text-end">Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let s of sales">
        <td>{{s.date}}</td>
        <td>{{items.find(i=>i.id===s.itemId)?.name}}</td>
        <td>{{s.qty}}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary btn-action" (click)="openEdit(s)">Edit</button>
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(s.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-modal [visible]="modalVisible" title="Sale" (close)="modalVisible=false">
  <form [formGroup]="saleForm" (ngSubmit)="save()">
    <div class="form-group"><label>Date</label><input formControlName="date" type="date" class="form-control"></div>
    <div class="form-group"><label>Item</label><select formControlName="itemId" class="form-control"><option *ngFor="let i of items" [value]="i.id">{{i.name}}</option></select></div>
    <div class="form-group"><label>Quantity</label><input formControlName="qty" type="number" min="1" class="form-control"></div>
    <div class="modal-footer"><button class="btn btn-secondary" type="button" (click)="modalVisible=false">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
  </form>
</app-modal>
