<div class="page-header">
  <h1 class="content-title">Users</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">New User</button>
</div>

<div class="table-container">
  <table>
    <thead><tr><th>Username</th><th>Email</th><th>Role</th><th class="text-end">Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{u.username}}</td>
        <td>{{u.email}}</td>
        <td>{{u.role}}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary btn-action" (click)="openEdit(u)">Edit</button>
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(u.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-modal [visible]="userModalVisible" title="User" (close)="closeUserModal()">
  <form [formGroup]="userForm" (ngSubmit)="saveUser()">
    <div class="form-group"><label>Username</label><input formControlName="username" class="form-control"></div>
    <div class="form-group"><label>Email</label><input formControlName="email" class="form-control" type="email"></div>
    <div class="form-group"><label>Role</label><select formControlName="role" class="form-control"><option>Admin</option><option>User</option></select></div>
    <div class="modal-footer"><button class="btn btn-secondary" type="button" (click)="closeUserModal()">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
  </form>
</app-modal>
