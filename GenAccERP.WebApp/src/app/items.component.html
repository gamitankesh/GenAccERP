<div class="page-header">
  <h1 class="content-title">Items</h1>
  <button type="button" class="btn btn-primary" (click)="openCreate()">New Item</button>
</div>

<div class="table-container">
  <table>
    <thead><tr><th>Item No</th><th>Name</th><th>Purchase</th><th>Sales</th><th class="text-end">Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let i of items">
        <td>{{i.itemNo}}</td>
        <td>{{i.name}}</td>
        <td>{{i.purchasePrice}}</td>
        <td>{{i.salesPrice}}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary btn-action" (click)="openEdit(i)">Edit</button>
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(i.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-modal [visible]="modalVisible" title="Item" (close)="modalVisible=false">
  <form [formGroup]="itemForm" (ngSubmit)="save()">
    <div class="form-group"><label>Item No</label><input formControlName="itemNo" class="form-control"></div>
    <div class="form-group"><label>Name</label><input formControlName="name" class="form-control"></div>
    <div class="form-group"><label>Category</label><select formControlName="categoryId" class="form-control"><option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option></select></div>
    <div class="form-group"><label>Purchase Price</label><input formControlName="purchasePrice" type="number" class="form-control"></div>
    <div class="form-group"><label>Sales Price</label><input formControlName="salesPrice" type="number" class="form-control"></div>
    <div class="modal-footer"><button class="btn btn-secondary" type="button" (click)="modalVisible=false">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
  </form>
</app-modal>
